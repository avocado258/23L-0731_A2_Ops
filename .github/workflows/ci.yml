name: CI
on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements_serve.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements_serve.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests run.py

      - name: Test
        run: pytest -v

      - name: Fetch champion model from MLflow registry
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          pip install mlflow==3.17.2 python-dotenv==1.2.3
          python scripts/fetch_model.py

      - name: Build Docker image
        run: docker build -t visionguard:ci .